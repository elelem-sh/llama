name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bin/test
      - run: bin/lint

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake pkg-config libffi-dev
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - run: bin/platform-check "$PWD/stories260K.gguf" cpu

  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - run: dnf install -y -q git ruby ruby-devel rubygems gcc-c++ make cmake pkgconf libffi-devel redhat-rpm-config
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - run: bin/platform-check "$PWD/stories260K.gguf" cpu

  prebuilt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-gnu
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
            cc: clang-15
            cxx: clang++-15
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
      VULKAN_SDK: /opt/vulkan
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - run: >-
          apt-get update -qq && apt-get install -y -qq build-essential ${{ matrix.cc }} cmake git ca-certificates
          python3 pkg-config libvulkan-dev spirv-headers libyaml-0-2 libssl3 zlib1g
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - id: vulkan
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /opt/vulkan
          key: vulkan-${{ matrix.platform }}-${{ hashFiles('bin/vulkan-toolchain') }}
      - if: steps.vulkan.outputs.cache-hit != 'true'
        run: bin/vulkan-toolchain /opt/vulkan
      - run: bin/portable-gem ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-${{ matrix.platform }}
          path: elelem-llama-*.gem
          if-no-files-found: error

  prebuilt-install:
    needs: prebuilt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-gnu
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
    runs-on: ${{ matrix.os }}
    container: fedora:44
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - run: dnf install -y -q ruby rubygems binutils tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-${{ matrix.platform }}
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - run: bin/bare-host
      - run: ruby bin/notices-in-the-gem "$PWD"/elelem-llama-*-${{ matrix.platform }}.gem
      - run: bin/platform-check "$PWD/stories260K.gguf" cpu "$PWD"/elelem-llama-*-${{ matrix.platform }}.gem

  prebuilt-musl:
    runs-on: ubuntu-latest
    container: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - run: apk add -q build-base cmake git curl xz linux-headers patchelf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - run: bin/gcc-runtime-as-noticed
      - run: bin/ruby-from-rv >> "$GITHUB_PATH"
      - run: bin/portable-gem x86_64-linux-musl
      - run: bin/musl-linkage ext/elelem/llama/native
      - run: bin/cpu-simd ext/elelem/llama/native
      - run: ls -l ext/elelem/llama/native elelem-llama-*.gem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-x86_64-linux-musl
          path: elelem-llama-*.gem
          if-no-files-found: error

  prebuilt-musl-install:
    needs: prebuilt-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
            ruby: rv
            without: /usr/lib/libstdc++.so.6 /usr/lib/libgcc_s.so.1
          - image: ruby:4.0-alpine@sha256:f172a0265b6a887e0342f822c26fa2ee1c2135c831033ee9ae58f41976d1f6b4
            ruby: image
            without: /usr/lib/libstdc++.so.6
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ELELEM_KV_CACHE_TYPE: f16
    steps:
      - run: apk add -q curl xz tar
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.ruby == 'rv'
        run: bin/ruby-from-rv >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-x86_64-linux-musl
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - run: bin/bare-host ${{ matrix.without }}
      - run: test "$(ruby -e 'print Gem::Platform.local')" = x86_64-linux-musl
      - run: ruby bin/notices-in-the-gem "$PWD"/elelem-llama-*-x86_64-linux-musl.gem
      - run: bin/platform-check "$PWD/stories260K.gguf" cpu "$PWD"/elelem-llama-*-x86_64-linux-musl.gem
      - run: ruby bin/runtime-from-the-gem
      - run: ruby bin/refusing-model stories260K.gguf refusing.gguf
      - run: ruby bin/refusal-from-the-shim refusing.gguf

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            backend: metal
          - os: macos-15-intel
            backend: cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - run: bin/platform-check "$PWD/stories260K.gguf" ${{ matrix.backend }}

  prebuilt-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: arm64-darwin
          - os: macos-15-intel
            platform: x86_64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - run: bin/portable-gem ${{ matrix.platform }}
      - run: bin/macos-linkage 13.3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-${{ matrix.platform }}
          path: elelem-llama-*.gem
          if-no-files-found: error

  prebuilt-macos-install:
    needs: prebuilt-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: arm64-darwin
            backend: metal
          - os: macos-15-intel
            platform: x86_64-darwin
            backend: cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-${{ matrix.platform }}
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - run: ruby bin/notices-in-the-gem "$PWD"/elelem-llama-*-${{ matrix.platform }}.gem
      - run: >-
          bin/without-compilers bin/platform-check "$PWD/stories260K.gguf" ${{ matrix.backend }}
          "$PWD"/elelem-llama-*-${{ matrix.platform }}.gem

  prebuilt-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - shell: pwsh
        run: >-
          ridk exec pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
      - run: bin/winpthreads-as-noticed
      - run: bin/portable-gem x64-mingw-ucrt
      - run: bin/windows-imports ext/elelem/llama/native
      - run: bin/windows-exports ext/elelem/llama/native
      - run: bin/cpu-simd ext/elelem/llama/native
      - run: ls -l ext/elelem/llama/native elelem-llama-*.gem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-x64-mingw-ucrt
          path: elelem-llama-*.gem
          if-no-files-found: error

  prebuilt-windows-install:
    needs: prebuilt-windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ELELEM_KV_CACHE_TYPE: f16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          windows-toolchain: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-x64-mingw-ucrt
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: stories260K.gguf
          key: stories260K-v1
      - if: steps.model.outputs.cache-hit != 'true'
        run: curl -fsSL -o stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
      - shell: pwsh
        run: |
          $kept = $env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw64|msys64|Strawberry|LLVM|CMake|Chocolatey\\bin' }
          "PATH=$($kept -join ';')" >> $env:GITHUB_ENV
      - run: |
          for tool in gcc g++ clang clang++ cc c++ cl x86_64-w64-mingw32-gcc ld cmake ninja; do
            if command -v "$tool"; then
              echo "$tool is installed: this job must prove that nothing compiles" >&2
              exit 1
            fi
          done
      - run: ruby bin/notices-in-the-gem "$PWD"/elelem-llama-*-x64-mingw-ucrt.gem
      - run: bin/platform-check "$PWD/stories260K.gguf" cpu "$PWD"/elelem-llama-*-x64-mingw-ucrt.gem
      - run: ruby bin/refusing-model stories260K.gguf refusing.gguf
      - run: ruby bin/windows-check refusing.gguf
      - run: ruby bin/refusal-from-the-shim refusing.gguf
      - run: gem uninstall -x elelem-llama
      - env:
          GEM_HOME: C:\gé
        run: |
          gem install --no-document elelem-llama-*-x64-mingw-ucrt.gem
          ruby bin/windows-check refusing.gguf
          ruby bin/refusal-from-the-shim refusing.gguf

  release-please:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs:
      - release-please
      - linux
      - fedora
      - macos
      - prebuilt-install
      - prebuilt-musl-install
      - prebuilt-macos-install
      - prebuilt-windows-install
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - run: test "$RELEASED" = "$GITHUB_SHA"
        env:
          RELEASED: ${{ needs.release-please.outputs.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
      - run: gem build elelem-llama.gemspec
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gem-*
          merge-multiple: true
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: bin/publish
