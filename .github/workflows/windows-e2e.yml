name: Windows e2e

on:
  schedule:
    - cron: "23 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELELEM_GGUF_MODEL: ${{ github.workspace }}\Qwen3.5-4B-Q4_K_M.gguf
    steps:
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          windows-toolchain: none
      - name: Keep a minidump of a ruby.exe that crashes
        shell: pwsh
        run: |
          $key = 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ruby.exe'
          reg add $key /f /v DumpFolder /t REG_EXPAND_SZ /d "$env:RUNNER_TEMP\dumps"
          reg add $key /f /v DumpType /t REG_DWORD /d 1
          $wer = "$env:RUNNER_TEMP\wer.rb"
          @'
          begin
            require "fiddle"
            Fiddle::Function.new(Fiddle.dlopen("kernel32")["SetErrorMode"], [-Fiddle::TYPE_INT], -Fiddle::TYPE_INT).call(1)
          rescue LoadError, StandardError => e
            warn "crash reports stay off: #{e.message}"
          end
          '@ | Set-Content $wer
          "RUBYOPT=-r$wer" >> $env:GITHUB_ENV
      - shell: pwsh
        run: |
          $kept = $env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw64|msys64|Strawberry|LLVM|CMake|Chocolatey\\bin' }
          "PATH=$($kept -join ';')" >> $env:GITHUB_ENV
      - shell: bash
        run: |
          for tool in gcc g++ clang clang++ cc c++ cl x86_64-w64-mingw32-gcc ld cmake ninja; do
            if command -v "$tool"; then
              echo "$tool is installed: this job must prove that nothing compiles" >&2
              exit 1
            fi
          done
      - shell: pwsh
        run: |
          gem install --no-document elelem-shell elelem-llama
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (gem list elelem-llama | Select-String 'x64-mingw-ucrt')) { exit 1 }
      - id: model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: Qwen3.5-4B-Q4_K_M.gguf
          key: qwen3.5-4b-e87f1764
      - if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          curl -fsSL -o Qwen3.5-4B-Q4_K_M.gguf
          https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf
      - shell: bash
        env:
          ELELEM_CMD_TIMEOUT: "60"
        run: |
          nonce=$(ruby -rsecurerandom -e 'print SecureRandom.hex')
          printf %s "$nonce" > nonce.txt
          started=$SECONDS
          elelem-shell "Run the command: cat nonce.txt and tell me what it prints" </dev/null | tee said.txt
          echo "tool call took $((SECONDS - started)) s"
          grep -q "$nonce" said.txt || { echo "the answer does not contain the nonce" >&2; exit 1; }
      - if: failure()
        shell: pwsh
        run: wevtutil qe Application /rd:true /c:10 /f:text /q:"*[System[Provider[@Name='Application Error' or @Name='Windows Error Reporting']]]"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-dumps-${{ github.job }}
          path: ${{ runner.temp }}/dumps
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  docs:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "4.0"
          windows-toolchain: none
      - name: Keep a minidump of a ruby.exe that crashes
        shell: pwsh
        run: |
          $key = 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ruby.exe'
          reg add $key /f /v DumpFolder /t REG_EXPAND_SZ /d "$env:RUNNER_TEMP\dumps"
          reg add $key /f /v DumpType /t REG_DWORD /d 1
          $wer = "$env:RUNNER_TEMP\wer.rb"
          @'
          begin
            require "fiddle"
            Fiddle::Function.new(Fiddle.dlopen("kernel32")["SetErrorMode"], [-Fiddle::TYPE_INT], -Fiddle::TYPE_INT).call(1)
          rescue LoadError, StandardError => e
            warn "crash reports stay off: #{e.message}"
          end
          '@ | Set-Content $wer
          "RUBYOPT=-r$wer" >> $env:GITHUB_ENV
      - shell: pwsh
        run: |
          $kept = $env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw64|msys64|Strawberry|LLVM|CMake|Chocolatey\\bin' }
          "PATH=$($kept -join ';')" >> $env:GITHUB_ENV
      - name: The Windows steps on elelem.sh/docs/start, verbatim
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gem install --no-document elelem-shell elelem-llama
          mkdir $HOME\.agents\models
          curl.exe -fL -o $HOME\.agents\models\Qwen3.5-4B-Q4_K_M.gguf https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf
          $env:ELELEM_GGUF_MODEL = "$HOME\.agents\models\Qwen3.5-4B-Q4_K_M.gguf"
          $nonce = [guid]::NewGuid().ToString('N')
          Set-Content -Path nonce.txt -Value $nonce -NoNewline
          if ((Get-Content -Raw nonce.txt) -ne $nonce) { throw 'nonce.txt does not hold the nonce' }
          $said = $null | elelem-shell "Read nonce.txt and tell me exactly what it says." | Out-String
          $said
          if (-not $said.Contains($nonce)) { throw "the answer does not contain the nonce $nonce" }
      - if: failure()
        shell: pwsh
        run: wevtutil qe Application /rd:true /c:10 /f:text /q:"*[System[Provider[@Name='Application Error' or @Name='Windows Error Reporting']]]"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-dumps-${{ github.job }}
          path: ${{ runner.temp }}/dumps
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
